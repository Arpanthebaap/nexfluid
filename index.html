<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Per-domain SEO bootstrap — runs FIRST, before any other meta tag is parsed.
      Googlebot's first-pass indexer reads the synchronously-mutated DOM, so each
      domain (nexfluid.it / nexfluid.com) gets its own language-specific title,
      description, OG tags, hreflang, JSON-LD and canonical, even though both
      domains share the same static index.html bundle.
    -->
    <script>
      (function () {
        try {
          var h = (location.hostname || '').toLowerCase();
          var isIt = h === 'nexfluid.it' || h === 'www.nexfluid.it' || h.indexOf('nexfluid.it') !== -1;
          var isEn = h === 'nexfluid.com' || h === 'www.nexfluid.com' || h.indexOf('nexfluid.com') !== -1;
          // Preview / localhost / vercel preview defaults to English for QA.
          var isPreview = h === 'localhost' || h.endsWith('.lovable.app') || h.indexOf('lovableproject.com') !== -1 || h.endsWith('.vercel.app');
          if (!isIt && !isEn && isPreview) isEn = true;
          if (isIt) isEn = false;

          var ORIGIN_IT = 'https://nexfluid.it';
          var ORIGIN_EN = 'https://nexfluid.com';
          var origin = isEn ? ORIGIN_EN : ORIGIN_IT;
          var altOrigin = isEn ? ORIGIN_IT : ORIGIN_EN;

          var lang = isEn ? 'en' : 'it';
          var locale = isEn ? 'en_US' : 'it_IT';
          var localeAlt = isEn ? 'it_IT' : 'en_US';

          var title = isEn
            ? 'Nexfluid — Automation in Stock | Valves, Pneumatics, Hydraulics'
            : 'Nexfluid — Automazione in Stock | Valvole, Pneumatica, Idraulica';
          var desc = isEn
            ? '85,000+ industrial components: valves, pneumatics, hydraulics, automation. Fast quotes, original parts, express shipping across Italy and EU.'
            : 'Oltre 85.000 componenti industriali: valvole, pneumatica, idraulica, automazione. Preventivi rapidi, ricambi originali, spedizione express in Italia e UE.';
          var ogTitle = isEn
            ? 'Nexfluid — Automation in Stock'
            : 'Nexfluid — Automazione in Stock';
          var ogDesc = isEn
            ? '85,000+ industrial components: valves, pneumatics, hydraulics, automation. Fast quotes, original parts, express shipping.'
            : 'Oltre 85.000 componenti industriali: valvole, pneumatica, idraulica, automazione. Preventivi rapidi, ricambi originali, spedizione express.';
          var twTitle = ogTitle;
          var twDesc = isEn
            ? '85,000+ industrial components: valves, pneumatics, hydraulics, automation.'
            : '85.000+ componenti industriali: valvole, pneumatica, idraulica, automazione.';
          var image = origin + '/nexfluid-logo.png';
          var path = location.pathname + location.search;

          // <html lang>
          document.documentElement.setAttribute('lang', lang);

          // Helper to write a meta tag immediately into the document being parsed.
          function w(html) { document.write(html); }

          // Title & primary meta
          w('<title>' + title + '</title>');
          w('<meta name="description" content="' + desc + '">');
          w('<meta http-equiv="content-language" content="' + lang + '">');

          // Canonical + hreflang (self-referencing first)
          w('<link rel="canonical" href="' + origin + path + '">');
          w('<link rel="alternate" hreflang="' + lang + '" href="' + origin + path + '">');
          w('<link rel="alternate" hreflang="' + (isEn ? 'it' : 'en') + '" href="' + altOrigin + path + '">');
          w('<link rel="alternate" hreflang="x-default" href="' + ORIGIN_IT + path + '">');

          // Open Graph
          w('<meta property="og:site_name" content="Nexfluid">');
          w('<meta property="og:type" content="website">');
          w('<meta property="og:title" content="' + ogTitle + '">');
          w('<meta property="og:description" content="' + ogDesc + '">');
          w('<meta property="og:url" content="' + origin + path + '">');
          w('<meta property="og:locale" content="' + locale + '">');
          w('<meta property="og:locale:alternate" content="' + localeAlt + '">');
          w('<meta property="og:image" content="' + image + '">');

          // Twitter
          w('<meta name="twitter:card" content="summary_large_image">');
          w('<meta name="twitter:title" content="' + twTitle + '">');
          w('<meta name="twitter:description" content="' + twDesc + '">');
          w('<meta name="twitter:image" content="' + image + '">');

          // JSON-LD — Organization
          var org = {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "Nexfluid",
            "url": origin,
            "logo": origin + "/nexfluid-logo.png",
            "description": isEn
              ? "Industrial automation components distributor — valves, pneumatics, hydraulics, automation parts"
              : "Distributore di componenti per l'automazione industriale — valvole, pneumatica, idraulica, ricambi automazione",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "Via De Gasperi 6",
              "addressLocality": "Saccolongo",
              "addressCountry": "IT"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "email": "info@nexfluid.it",
              "telephone": "+39-333-8933395",
              "contactType": "sales",
              "areaServed": ["IT", "EU"],
              "availableLanguage": ["Italian", "English"]
            },
            "sameAs": []
          };
          var site = {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "Nexfluid",
            "url": origin,
            "inLanguage": lang,
            "potentialAction": {
              "@type": "SearchAction",
              "target": origin + "/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          };
          w('<script type="application/ld+json">' + JSON.stringify(org) + '<\/script>');
          w('<script type="application/ld+json">' + JSON.stringify(site) + '<\/script>');
        } catch (e) {}
      })();
    </script>
